name: Avatar Regression

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (UTC). GitHub cron can run a few minutes late.
  workflow_dispatch: {}      # adds a "Run workflow" button for manual runs

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/runner.js

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: logs/
          retention-days: 14
